<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ page.title }} | Matthew J. Monnot, PhD</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Matthew J. Monnot, PhD — Industrial-Organizational Psychologist, People Scientist, and OD Consultant. Executive education, Fortune 100 people insights, and applied machine learning for I-O psychology.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ "/assets/main.css" | relative_url }}">
  </head>
  <body>
    <header class="site-header">
      <div class="wrapper">
        <h1 class="site-title">
          <a href="{{ "/" | relative_url }}">Matthew J. Monnot, PhD</a>
        </h1>
        <nav class="site-nav">
          <a href="{{ "/" | relative_url }}" {% if page.url == "/" %}class="active"{% endif %}>Home</a>
          <a href="{{ "/cv.html" | relative_url }}" {% if page.url == "/cv.html" %}class="active"{% endif %}>CV</a>
          <a href="{{ "/publications.html" | relative_url }}" {% if page.url contains "/publications" %}class="active"{% endif %}>Publications</a>
          <a href="{{ "/themes/leadership-and-wellbeing.html" | relative_url }}" {% if page.url contains "/themes/" %}class="active"{% endif %}>Themes</a>
          <a href="{{ "/press.html" | relative_url }}" {% if page.url == "/press.html" %}class="active"{% endif %}>Media</a>
          <a href="{{ "/projects.html" | relative_url }}" {% if page.url == "/projects.html" %}class="active"{% endif %}>Projects</a>
        </nav>
      </div>
    </header>

    <main class="page-content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    <footer class="site-footer">
      <div class="wrapper">
        <p class="footer-role">I-O Psychologist &middot; People Scientist &middot; OD Consultant</p>
        <p>
          <a href="https://www.linkedin.com/in/monnot">LinkedIn</a> &nbsp;&middot;&nbsp;
          <a href="https://x.com/Matt_Monnot">X</a> &nbsp;&middot;&nbsp;
          <a href="https://www.youtube.com/@matthewjmonnot">YouTube</a> &nbsp;&middot;&nbsp;
          <a href="https://scholar.google.com/citations?user=BhmHT_UAAAAJ&hl=en">Google Scholar</a> &nbsp;&middot;&nbsp;
          <a href="https://github.com/mjmonnot">GitHub</a>
        </p>
      </div>
    </footer>
    {% if page.url == "/" %}
    <script src="{{ "/assets/featured-carousel.js" | relative_url }}" defer></script>
    {% endif %}
  </body>
</html>
